<!--
  섹션 HTML 템플릿
  이 템플릿을 복사하여 각 섹션을 생성합니다.
-->

<!-- 기본 2컬럼 섹션 -->
<section class="presentation-section" data-section="섹션명" id="section-섹션명">
  <div class="section-content">
    <div class="section-header">
      <span class="section-number">01</span>
      <h2 class="section-title">섹션 제목</h2>
    </div>
    <div class="section-body">
      <div class="content-block">
        <h3>소제목</h3>
        <p>내용을 여기에 작성합니다.</p>
        <ul>
          <li>항목 1</li>
          <li>항목 2</li>
          <li>항목 3</li>
        </ul>
      </div>
      <div class="visual-block">
        <!-- 이미지 또는 차트 -->
        <img src="assets/images/[이미지명].png" alt="설명">
        <!-- 또는 -->
        <div class="chart-container">
          <canvas id="chartId"></canvas>
        </div>
      </div>
    </div>
  </div>
</section>


<!-- 전체 너비 섹션 (아키텍처) -->
<section class="presentation-section" data-section="architecture" id="section-architecture">
  <div class="section-content">
    <div class="section-header">
      <span class="section-number">03</span>
      <h2 class="section-title">시스템 아키텍처</h2>
    </div>
    <div class="section-body" style="grid-template-columns: 1fr;">
      <div class="arch-container">
        <!-- 아키텍처 컴포넌트 -->
      </div>
    </div>
  </div>
</section>


<!-- 차트 그리드 섹션 -->
<section class="presentation-section" data-section="data" id="section-data">
  <div class="section-content">
    <div class="section-header">
      <span class="section-number">04</span>
      <h2 class="section-title">데이터 분석</h2>
    </div>
    <div class="section-body">
      <div class="grid-2">
        <div class="chart-container">
          <canvas id="chart1"></canvas>
        </div>
        <div class="chart-container">
          <canvas id="chart2"></canvas>
        </div>
      </div>
    </div>
  </div>
</section>


<!-- 코드 강조 섹션 -->
<section class="presentation-section" data-section="code" id="section-code">
  <div class="section-content">
    <div class="section-header">
      <span class="section-number">05</span>
      <h2 class="section-title">구현 예시</h2>
    </div>
    <div class="section-body" style="grid-template-columns: 1fr 2fr;">
      <div class="content-block">
        <h3>설명</h3>
        <p>코드에 대한 설명</p>
      </div>
      <div class="visual-block">
        <pre><code class="language-javascript">
// 코드 예시
function example() {
  return 'Hello World';
}
        </code></pre>
      </div>
    </div>
  </div>
</section>


<!-- 비교 테이블 섹션 -->
<section class="presentation-section" data-section="comparison" id="section-comparison">
  <div class="section-content">
    <div class="section-header">
      <span class="section-number">06</span>
      <h2 class="section-title">비교 분석</h2>
    </div>
    <div class="section-body" style="grid-template-columns: 1fr;">
      <div class="comparison-table">
        <table>
          <thead>
            <tr>
              <th>항목</th>
              <th>Option A</th>
              <th>Option B</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>기능 1</td>
              <td><i data-lucide="check" class="text-success"></i></td>
              <td><i data-lucide="x" class="text-error"></i></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>


<!-- 하이라이트 카드 섹션 -->
<section class="presentation-section" data-section="highlights" id="section-highlights">
  <div class="section-content">
    <div class="section-header">
      <span class="section-number">07</span>
      <h2 class="section-title">핵심 성과</h2>
    </div>
    <div class="section-body" style="grid-template-columns: 1fr;">
      <div class="highlight-cards">
        <div class="highlight-card">
          <div class="highlight-value">95%</div>
          <div class="highlight-label">고객 만족도</div>
        </div>
        <div class="highlight-card">
          <div class="highlight-value">2.5x</div>
          <div class="highlight-label">성능 향상</div>
        </div>
        <div class="highlight-card">
          <div class="highlight-value">40%</div>
          <div class="highlight-label">비용 절감</div>
        </div>
      </div>
    </div>
  </div>
</section>


<!-- 이미지 플레이스홀더 (이미지 생성 필요시) -->

Style: Dark tech illustration, blue/purple gradient

[/IMAGE_PROMPT] -->

  <p style="color: #94a3b8; margin-top: 12px;">이미지 삽입 위치</p>
</div>
